  <h1>「竹簡尋源」 – 字詞之「簡」源 </h1>  <br><p>我國簡帛牘書寫千多年，究竟簡牘始於何時？  從文字學分析， 就知道其答案!   甲骨文、金文中的「冊」字， 就描繪了用繩子將竹簡編連起來的樣子，這表明在殷商時期就已經有使用簡帛牘的可能性!   文天祥的著名詩句「人生自古誰無死，留取丹心照汗青」的「汗青」原來亦與竹簡書寫有關!  下表列出一些字詞及成語之「簡」源。
